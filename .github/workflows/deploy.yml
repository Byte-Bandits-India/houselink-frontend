name: Deploy Next.js to Webuzo

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_WEB_API_URL=https://nextjs.houselink360.com
            NEXT_PUBLIC_SITE_URL=https://nextjs.houselink360.com
          tags: ghcr.io/byte-bandits-india/houselink-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 103.91.186.61
          username: houselink360
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 2244
          script: |
            set -e
            cd /home/houselink360/houselink
            
            # Login to GitHub Packages on the remote VM
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Pull latest frontend image
            export REGISTRY_OWNER="ghcr.io/byte-bandits-india"
            export IMAGE_TAG="latest"
            docker compose -f docker-compose.prod.yml pull frontend
            
            # Restart frontend container
            docker compose -f docker-compose.prod.yml up -d --remove-orphans frontend
            
            # Clean up old unused images
            docker image prune -f